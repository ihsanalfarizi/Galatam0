<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Klasemen Galatama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--grid:#D9C2F5; --ink:#000; --muted:#4A4A4A;
  --sheet-bg:#F6EEFF; --cell-bg:#FFFFFF;
  --stripe:#EBDDFF;          
  --head-bg:#9C6BF0;         
  --server-bg:#CE93D8;       
  --green:#7E57C2; --red:#C0392B; --sel-border:#5E35B1; 
  --fs:16px;
  color-scheme:light;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;background:var(--sheet-bg);font-family:'Lexend','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:var(--ink);padding:24px 10px 60px;font-size:18px;font-weight:500;overflow-x:hidden;}
.wrap{width:1400px;margin:0 auto;}
.panel{background:var(--cell-bg);border:1px solid var(--grid);border-radius:4px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.table-scroll{min-width:0;}
table{width:100%;border-collapse:collapse;table-layout:fixed;background:var(--cell-bg);font-size:var(--fs);}
col.col-rank{width:9%;}
col.col-nick{width:43%;}
col.col-points{width:28%;}
col.col-join{width:10%;}
col.col-hist{width:10%;}
th.colhead{background:var(--head-bg);border:2px solid #7E57C2;font-weight:700;font-size:1em;color:#fff;text-align:center;padding:.7em 2px;letter-spacing:.3px;position:relative;}
thead th:nth-child(4),thead th:last-child{font-size:.55em;padding:1.1em 0;white-space:nowrap;overflow:hidden;}
tbody td{border:2px solid #7E57C2;background:var(--cell-bg);vertical-align:middle;padding:0;font-size:1em;}
tbody tr:nth-child(even) td{background:var(--stripe);}
td.rank{text-align:center;font-weight:800;font-size:1.1em;}
td.center{text-align:center;padding-left:2px;padding-right:2px;}
td.poin-cell{text-align:center;padding:2px 1px;}
tbody tr.server td{background:var(--server-bg);font-weight:800;}
tbody tr.server td.rank,tbody tr.server input.team-name,tbody tr.server input.team-nick{font-weight:800;color:#2A0A4A;}
tbody tr.server.server.server.server td{background:#D1B3FF;color:#000;}
tbody tr.server.server.server.server td.rank,tbody tr.server.server input.team-name,tbody tr.server.server input.team-nick{color:#000;font-weight:800;}
tbody tr.server.server input.team-name::placeholder,tbody tr.server.server input.team-nick::placeholder{color:#000;}
tbody tr.server.server.server.server.search-hit td{background:#FFF176;}
tbody tr.server.server.search-hit input.team-name,tbody tr.server.server.search-hit input.team-nick,tbody tr.server.server.search-hit td.rank{color:var(--ink);}
tbody tr.zero:not(.blank) td.name-cell,tbody tr.zero:not(.blank) td.poin-cell{background:#E4D4FF;}
tbody tr.pos td.name-cell,tbody tr.pos td.poin-cell{background:#B794F6;}
tbody tr.rank-1 td.name-cell,tbody tr.rank-1 td.poin-cell{background:#FFC400;}
tbody tr.rank-2 td.name-cell,tbody tr.rank-2 td.poin-cell{background:#B8C4CC;}
tbody tr.rank-3 td.name-cell,tbody tr.rank-3 td.poin-cell{background:#E58E3A;}
tbody tr[class*="rank-"] td.rank{font-weight:800;}
tbody tr.tie-0 td.name-cell,tbody tr.tie-0 td.poin-cell{background:#B388FF;}
tbody tr.tie-1 td.name-cell,tbody tr.tie-1 td.poin-cell{background:#26C6DA;}
tbody tr.tie-2 td.name-cell,tbody tr.tie-2 td.poin-cell{background:#F06292;}
tbody tr.tie-3 td.name-cell,tbody tr.tie-3 td.poin-cell{background:#A1887F;}
tbody tr.tie-4 td.name-cell,tbody tr.tie-4 td.poin-cell{background:#5C7CFA;}
tbody tr[class*="tie-"] td.rank{font-weight:800;}
@keyframes flashUp{0%,65%{background-color:#2ECC71;}}
@keyframes flashDown{0%,65%{background-color:#42A5F5;}}
tbody tr.flash-up td{animation:flashUp 2.4s ease-out;}
tbody tr.flash-down td{animation:flashDown 2.4s ease-out;}
.copyright{user-select:none;-webkit-user-select:none;}
input.team-name,input.team-nick{width:100%;border:none;background:transparent;font-family:inherit;font-weight:700;font-size:1.08em;color:var(--ink);padding:.75em .3em;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
input.team-name{text-transform:none;}
input.team-name::placeholder,input.team-nick::placeholder{color:var(--muted);opacity:.6;font-weight:400;text-transform:none;}
input.team-name:focus,input.team-nick:focus{outline:none;background:#fff;box-shadow:inset 0 0 0 2px var(--sel-border);text-align:left;}
.points-wrap{display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:nowrap;}
input.points{width:1.9em;min-width:0;border:2px solid rgba(0,0,0,.6);border-radius:6px;background:#fff;font-family:inherit;font-weight:800;font-size:1.2em;color:var(--ink);text-align:center;padding:0 .2em;line-height:1.3;height:1.3em;flex:none;cursor:default;margin-right:.35em;overflow:visible;-webkit-appearance:none;appearance:none;-webkit-text-fill-color:currentColor;opacity:1;}
input.points:focus{outline:none;}
.points-wrap>*{flex-shrink:0;}
input.points{width:1.8em;font-size:1.6em;height:1.25em;line-height:1.2;padding:0 .1em;margin-right:.3em;}
.fish-btn{height:1.7em;padding:0 .15em;}
.fish-btn img{height:1.3em;}
.fish-btn{font-size:1em;height:2.1em;flex:none;border-radius:4px;border:2px solid #7E57C2;background:#F3E5FF;cursor:pointer;padding:0 .2em;display:flex;align-items:center;justify-content:center;gap:.1em;font-family:inherit;white-space:nowrap;}
.fish-btn img{height:1.7em;width:auto;display:block;pointer-events:none;}
.fish-btn:hover{background:#E6CCFF;border-color:#4527A0;}
.fish-btn:active{transform:scale(.93);}
.fish-opt{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:2px solid #E1E1E1;font-size:24px;font-weight:700;cursor:pointer;}
.fish-opt input{width:30px;height:30px;accent-color:var(--green);}
.fish-opt .fp{margin-left:auto;color:var(--green);font-weight:800;}
.fish-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;border-top:2px solid var(--grid);}
.fish-foot b{font-size:30px;color:#4527A0;}
.fish-ok{background:var(--green);color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:24px;font-weight:700;padding:12px 28px;cursor:pointer;}
.hist-fish{display:block;font-size:20px;font-weight:600;color:#E65100;}
.join-btn{width:1.3em;height:1.5em;max-width:100%;border-radius:3px;cursor:pointer;font-size:1em;font-weight:800;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0;font-family:inherit;transition:background .12s,border-color .12s,color .12s,transform .08s;user-select:none;background:#fff;border:2px solid #444;color:transparent;}
.join-btn:active{transform:scale(.9);}
.join-btn:hover{border-color:#7E57C2;}
.join-btn.joined{background:#7E57C2;border-color:#7E57C2;color:#fff;}
.hist-btn{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;max-width:100%;border-radius:2px;border:1px solid var(--grid);background:#fff;color:var(--muted);font-size:1em;cursor:pointer;position:relative;transition:border-color .12s;}
.hist-btn:hover{border-color:var(--sel-border);}
.hist-btn:active{transform:scale(.92);}
td.center .join-btn{width:100%;height:2.1em;font-size:1.3em;border-radius:4px;}
td.center .hist-btn{width:100%;height:2.1em;border-radius:4px;}
td.center .hist-btn .ico{width:1.4em;height:1.4em;}
.hist-btn .hist-count{position:absolute;top:-.4em;right:-.4em;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--red);color:#fff;font-size:max(9px,.5em);font-weight:600;display:flex;align-items:center;justify-content:center;line-height:1;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal-box{width:100%;max-width:680px;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;background:#fff;border:2px solid var(--grid);border-radius:8px;box-shadow:0 16px 48px rgba(0,0,0,.35);overflow:hidden;}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;background:var(--head-bg);color:#fff;border-bottom:2px solid var(--grid);}
.modal-title{font-weight:700;font-size:28px;}
.modal-title small{display:block;font-weight:500;font-size:20px;opacity:.9;margin-top:4px;}
.modal-close{width:48px;height:48px;border-radius:4px;border:2px solid var(--grid);background:#fff;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;flex:none;}
.modal-close:hover{border-color:var(--red);color:var(--red);}
.modal-body{overflow-y:auto;padding:10px 22px 22px;}
.hist-empty{text-align:center;color:var(--muted);font-size:22px;padding:40px 10px;}
.hist-list{list-style:none;margin:0;padding:0;}
.hist-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;border-bottom:2px solid #E1E1E1;}
.hist-item:last-child{border-bottom:none;}
.hist-delta{font-weight:800;font-size:36px;min-width:100px;}
.hist-delta.pos{color:var(--green);}
.hist-delta.neg{color:var(--red);}
.hist-meta{flex:1;text-align:right;}
.hist-time{font-size:22px;font-weight:500;color:var(--muted);display:block;}
.hist-after{font-size:24px;font-weight:700;display:block;margin-bottom:2px;}
@media (max-width:520px){
  .modal-title{font-size:22px;}
  .modal-title small{font-size:16px;}
  .hist-delta{font-size:28px;min-width:76px;}
  .hist-after{font-size:19px;}
  .hist-time{font-size:16px;}
  .hist-fish{font-size:15px;}
  .fish-opt{font-size:20px;}
}
.top-row{display:flex;align-items:stretch;gap:10px;margin:0 0 10px;}
.top-row .search-bar{flex:1;min-width:0;margin:0;}
.search-bar{display:flex;align-items:center;gap:6px;margin:0 0 8px;padding:3px 12px;background:#fff;border:2px solid var(--head-bg);border-radius:6px;}
.search-bar:focus-within{border-color:var(--sel-border);}
.search-bar.active{border-color:#5E35B1;background:#F0E0FF;}
.search-icon{font-size:calc(var(--fs)*1.15);flex:none;display:flex;}
#searchInput{flex:1;min-width:0;border:none;background:transparent;font-family:inherit;font-weight:500;font-size:calc(var(--fs)*1.1);color:var(--ink);padding:.3em 4px;}
#searchInput:focus{outline:none;}
#searchClear{display:none;flex:none;width:1.5em;height:1.5em;border-radius:3px;border:1px solid var(--grid);background:#fff;color:var(--muted);font-size:calc(var(--fs)*.85);cursor:pointer;line-height:1;}
#searchClear:hover{border-color:var(--red);color:var(--red);}
#searchCount{display:none;flex:none;font-weight:600;font-size:calc(var(--fs)*.8);padding:.15em .6em;border-radius:999px;color:#fff;background:var(--green);white-space:nowrap;}
#searchCount.none{background:var(--red);}
body.searching tbody tr{opacity:.3;transition:opacity .15s;}
body.searching tbody tr.search-hit{opacity:1;}
tbody tr.search-hit td,tbody tr.search-hit td.name-cell,tbody tr.search-hit td.poin-cell{background:#FFF176;box-shadow:inset 0 4px 0 #E65100,inset 0 -4px 0 #E65100;}
tbody tr.search-hit td:first-child{box-shadow:inset 4px 0 0 #E65100,inset 0 4px 0 #E65100,inset 0 -4px 0 #E65100;}
tbody tr.search-hit td:last-child{box-shadow:inset -4px 0 0 #E65100,inset 0 4px 0 #E65100,inset 0 -4px 0 #E65100;}
.medal{display:inline-flex;align-items:center;justify-content:center;width:1.7em;height:1.7em;border-radius:50%;font-weight:800;font-size:.95em;color:#222;border:2px solid rgba(0,0,0,.35);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);}
.medal.m1{background:linear-gradient(#FFE27A,#F5B700);}
.medal.m2{background:linear-gradient(#F4F6F8,#AEB8C2);}
.medal.m3{background:linear-gradient(#F0B27A,#B8691F);color:#fff;}
.ico{width:1.05em;height:1.05em;display:block;}
.copyright{margin-top:14px;text-align:center;font-weight:800;font-size:calc(var(--fs)*.9);color:#7B1FA2;letter-spacing:.3px;}
#fishModal .modal-box{max-width:460px;}
#fishModal .modal-head{padding:12px 18px;}
#fishModal .modal-title{font-size:23px;}
#fishModal .modal-title small{font-size:16px;margin-top:3px;}
#fishModal .modal-close{width:38px;height:38px;font-size:20px;}
#fishModal .modal-body{padding:4px 18px 8px;}
#fishModal .fish-opt{font-size:20px;gap:10px;padding:9px 0;}
#fishModal .fish-opt .fp{margin-left:auto;order:2;font-size:19px;}
#fishModal .fish-opt input{order:3;width:27px;height:27px;margin:0 0 0 12px;}
#fishModal .fish-foot{padding:10px 18px;}
#fishModal .fish-foot b{font-size:25px;}
#fishModal .fish-ok{font-size:20px;padding:10px 24px;}
.top-row{flex-wrap:wrap;gap:5px 8px;margin:0 0 5px;}
.top-row .search-bar{flex:1 1 100%;padding:0 10px;}
.search-icon{font-size:calc(var(--fs)*1.9);}
#searchInput{font-size:calc(var(--fs)*.85);padding:.15em 4px;}
#searchCount{font-size:calc(var(--fs)*.7);}
#searchClear{font-size:calc(var(--fs)*.75);}
.copyright{margin-top:2px;font-size:calc(var(--fs)*1.6);line-height:1.2;}
body{padding-top:0;}
.panel{padding-top:6px;border-top:none;border-radius:0 0 4px 4px;}
.top-row{margin-top:0;}
.top-row .search-bar{margin-top:0;border-top-width:2px;}
.top-row .search-bar{position:fixed;top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:auto;left:50%;transform:translateX(-50%);width:760px;max-width:calc(100vw - 28px);flex:none;margin:0;padding:16px 24px;gap:16px;background:#2b2b2d;border:0;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:90;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .12s;}
body.search-open .top-row .search-bar{visibility:visible;opacity:1;pointer-events:auto;}
.top-row .search-bar.active{background:#2b2b2d;border:0;}
.top-row #searchInput{font-size:calc(var(--fs)*2.1);color:#fff;padding:.3em 6px;}
#searchInput::placeholder{color:#8e8e93;opacity:1;}
.top-row #searchCount{background:transparent;color:#c8c8cc;font-size:calc(var(--fs)*1.3);padding:0;}
.top-row #searchCount.none{background:transparent;color:#ff8a80;}
.search-nav,.top-row #searchClear{flex:none;display:flex;align-items:center;justify-content:center;width:2.4em;height:2.4em;border:0;background:transparent;color:#c8c8cc;border-radius:6px;padding:0;cursor:pointer;font-family:inherit;}
.top-row #searchClear{display:flex !important;font-size:calc(var(--fs)*1.6);}
.search-nav:hover,.top-row #searchClear:hover{background:#3a3a3c;color:#fff;}
.search-nav svg{width:1.1em;height:1.1em;}
#searchFab{position:fixed;top:auto;bottom:calc(6px + env(safe-area-inset-bottom,0px));right:auto;left:50%;transform:translateX(-50%);width:3.2em;height:3.2em;border-radius:50%;border:0;background:#2b2b2d;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.85;z-index:89;padding:0;font-size:var(--fs);box-shadow:0 4px 12px rgba(0,0,0,.3);transition:opacity .15s;}
#searchFab:hover{opacity:1;}
#searchFab svg{width:1.2em;height:1.2em;}
body.search-open #searchFab{display:none;}
tbody tr.search-hit.search-cur td,tbody tr.search-hit.search-cur td.name-cell,tbody tr.search-hit.search-cur td.poin-cell{background:#FFC107;}
td.rank.red-toggle{cursor:pointer;user-select:none;-webkit-user-select:none;}
tbody tr.red td,tbody tr.red td.name-cell,tbody tr.red td.poin-cell{background:#E53935;color:#fff;}
tbody tr.red input.team-name,tbody tr.red input.team-nick{color:#fff;}
tbody tr.red input.team-name::placeholder,tbody tr.red input.team-nick::placeholder{color:#FFCDD2;}
tbody tr.red input.team-name:focus,tbody tr.red input.team-nick:focus{background:#fff;color:#000;}
tbody tr.red.search-hit td,tbody tr.red.search-hit td.name-cell,tbody tr.red.search-hit td.poin-cell{background:#FF8A80;}
tbody tr.red.search-hit input.team-name,tbody tr.red.search-hit input.team-nick{color:#000;}
tbody tr.server input.team-name,tbody tr.server input.team-nick,tbody tr.server.server.server input.team-name,tbody tr.server.server.server input.team-nick{color:#000 !important;-webkit-text-fill-color:#000;}
.points-wrap{gap:1px;max-width:100%;overflow:hidden;}
input.points{width:1.6em;font-size:1.85em;height:1.2em;margin-right:.15em;}
.fish-btn{height:1.4em;padding:0 .1em;border-width:1px;}
.fish-btn img{height:1.05em;}
.panel .copyright{margin-top:5px;padding-top:3px;line-height:1.15;}
.panel{border-radius:4px;padding-bottom:7px;}
.copy-mark{display:inline-block;margin-right:.08em;font-weight:800;}
.mode-toggle{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:95;display:inline-flex;align-items:center;border:2px solid var(--head-bg);border-radius:999px;overflow:hidden;background:var(--cell-bg);font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.35);opacity:.92;transition:opacity .15s;}
.mode-toggle:hover{opacity:1;}
.mode-toggle button{border:0;background:transparent;color:var(--ink);font-family:inherit;font-weight:700;font-size:1em;padding:.35em .9em;cursor:pointer;white-space:nowrap;}
.mode-toggle button.on{background:var(--head-bg);color:#fff;}
body.night{--sheet-bg:#170F24;--cell-bg:#251A38;--ink:#F2F2F2;--muted:#B5B5B5;--grid:#4A3566;--stripe:#322247;--head-bg:#6A3FB5;color-scheme:dark;}
body.night tbody td,body.night th.colhead{border-color:#7A5AA8;}
body.night .panel{border-color:#4A3566;box-shadow:0 2px 8px rgba(0,0,0,.6);}
body.night tbody tr.pos:not(.red) input.team-name,body.night tbody tr.pos:not(.red) input.team-nick,body.night tbody tr.zero:not(.blank):not(.red) input.team-name,body.night tbody tr.zero:not(.blank):not(.red) input.team-nick,body.night tbody tr[class*="rank-"]:not(.red) input.team-name,body.night tbody tr[class*="rank-"]:not(.red) input.team-nick,body.night tbody tr[class*="tie-"]:not(.red) input.team-name,body.night tbody tr[class*="tie-"]:not(.red) input.team-nick,body.night tbody tr.search-hit:not(.red) input.team-name,body.night tbody tr.search-hit:not(.red) input.team-nick,body.night tbody tr.search-hit:not(.red) td.rank{color:#000;}
body.night input.team-name:focus,body.night input.team-nick:focus{background:#fff;color:#000 !important;}

body.night .hist-btn{background:#33264D;border-color:#7A5AA8;color:#DDD;}
body.night .join-btn:not(.joined){background:#33264D;border-color:#8A8A8A;}

body.night .hist-item,body.night .fish-opt{border-bottom-color:#4A3566;}

body.night .fish-foot b{color:#E1BEFF;}

body.night .hist-delta.neg{color:#FF8A80;}
body.night .hist-fish{color:#FFB74D;}

.pm-btn{flex:none;width:2.4em;height:1.5em;border-radius:4px;border:2px solid var(--green);background:#fff;color:var(--green);font-family:inherit;font-weight:800;font-size:.95em;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.pm-btn:hover{background:#F3E8FF;}
.pm-btn:active{transform:scale(.92);}
#pmModal.modal-overlay{background:transparent;padding:0;align-items:flex-start;justify-content:flex-start;}
#pmModal .modal-box{position:absolute;width:260px;max-width:260px;border-width:2px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.4);}
#pmModal .modal-head{padding:5px 9px;gap:8px;border-bottom-width:1px;}
#pmModal .modal-title{font-size:15px;line-height:1.1;}
#pmModal .modal-title small{font-size:13px;margin-top:0;}
#pmModal .modal-close{width:24px;height:24px;font-size:13px;border-width:1px;}
#pmModal .modal-body{padding:5px 9px 8px;}
.pm-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:4px 0;}
.pm-grid button{border-radius:5px;font-family:inherit;font-weight:800;font-size:15px;padding:6px 0;cursor:pointer;border:2px solid;line-height:1.1;}
.pm-grid button:active{transform:scale(.93);}
.pm-grid .plus{background:#F3E8FF;border-color:var(--green);color:#4527A0;}

<body>
<div class="wrap">
  <div class="hero">
    <div class="podium" id="podium"></div>
  </div>
  <div class="panel">
    <div class="top-row">
    <div class="search-bar">
      <span class="search-icon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#B0B0B0" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></span>
      <input type="text" id="searchInput" placeholder="Find..." autocomplete="off">
      <span id="searchCount"></span>
      <button type="button" class="search-nav" id="searchPrev" title="Sebelumnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
      <button type="button" class="search-nav" id="searchNext" title="Berikutnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <button type="button" id="searchClear" title="Tutup (Esc)">✕</button>
    </div>
    </div>
    <div class="tables">
      <div class="table-scroll"><table>
        <colgroup><col class="col-rank"><col class="col-nick"><col class="col-points"><col class="col-join"><col class="col-hist"></colgroup>
        <thead><tr><th class="colhead">NO</th><th class="colhead ">DISPLAY NAMA</th><th class="colhead ">POINT</th><th class="colhead">Absen</th><th class="colhead">History</th></tr></thead>
        <tbody id="tableBodyTop"></tbody>
      </table></div>
      <div class="table-scroll"><table>
        <colgroup><col class="col-rank"><col class="col-nick"><col class="col-points"><col class="col-join"><col class="col-hist"></colgroup>
        <thead><tr><th class="colhead">NO</th><th class="colhead ">DISPLAY NAMA</th><th class="colhead ">POINT</th><th class="colhead">Absen</th><th class="colhead">History</th></tr></thead>
        <tbody id="tableBodyBottom"></tbody>
      </table></div>
    </div>
    <div class="copyright"><span class="copy-mark" title="Copyright">&copy;</span>Created By Aaronnn</div>
  </div>
</div>

<!-- Notifikasi poin mengambang -->
<div class="pt-toasts" id="ptToasts"></div>

<button type="button" class="sound-toggle" id="soundToggle" title="Suara notifikasi poin ON / OFF">🔊 Suara</button>

<div class="mode-toggle" id="modeToggle" title="Pilih mode tampilan"><button type="button" data-mode="day" class="on">☀️ Day</button><button type="button" data-mode="night">🌙 Night</button></div>

<button type="button" id="searchFab" title="Cari (Ctrl+F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>

<div class="modal-overlay" id="histModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="histModalTitle">History<small id="histModalSub"></small></div>
      <button type="button" class="modal-close" id="histModalClose">✕</button>
    </div>
    <div class="modal-body" id="histModalBody"></div>
  </div>
</div>

<div class="modal-overlay" id="fishModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">Tarik Ikan<small id="fishSub"></small></div>
      <button type="button" class="modal-close" id="fishClose">✕</button>
    </div>
    <div class="modal-body" id="fishList"></div>
    <div class="fish-foot"><span>Total: <b id="fishTotal">+0</b></span><button type="button" class="fish-ok" id="fishOk">Tambah</button></div>
  </div>
</div>

<div class="modal-overlay" id="pmModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">Tambah / Kurang Poin<small id="pmSub"></small></div>
      <button type="button" class="modal-close" id="pmClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="pm-grid" id="pmPlus"></div>
      <div class="pm-grid" id="pmMinus"></div>
    </div>
  </div>
</div>

<script>
  // 30 peserta: No 1-29 kosong (isi Nama Display sendiri), No 30 = Admin
  const TOTAL_PESERTA = 30;
  const ADMIN_ID = 30;
  const ROWS_PER_TABLE = 15;
  const teams = [];
  for(let i = 1; i <= TOTAL_PESERTA; i++){
    // red = true -> baris diwarnai merah (hanya warna, tidak mengubah poin/peringkat)
    teams.push({ id:i, nickname: i === ADMIN_ID ? 'Admin' : '', points:0, joined: i === ADMIN_ID, red:false, history:[], flash:null });
  }

  // Gambar ikan (SVG tertanam, tidak perlu file luar). Untuk pakai gambar sendiri,
  // ganti isi FISH_IMG dengan data URI / nama file gambar, mis. 'ikan.png'
  const FISH_SVG =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
    '<circle cx="28" cy="36" r="26" fill="#FFB300" stroke="#6D4000" stroke-width="4"/>' +
    '<circle cx="28" cy="36" r="19" fill="#FFD54F" stroke="#6D4000" stroke-width="2.5"/>' +
    '<path fill-rule="evenodd" fill="#6D4000" d="M20 22h13a9 9 0 0 1 0 18h-6v10h-7zM27 28v6h6a3 3 0 0 0 0-6z"/>' +
    '<circle cx="50" cy="14" r="13" fill="#2E7D32" stroke="#fff" stroke-width="3"/>' +
    '<path d="M50 7 V21 M43 14 H57" stroke="#fff" stroke-width="5" stroke-linecap="round"/>' +
    '</svg>';
  const FISH_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(FISH_SVG);

  const tbodyTop = document.getElementById('tableBodyTop');
  const tbodyBottom = document.getElementById('tableBodyBottom');
  const histModal = document.getElementById('histModal');
  const histModalBody = document.getElementById('histModalBody');
  const histModalTitle = document.getElementById('histModalTitle');
  const histModalSub = document.getElementById('histModalSub');
  const histModalClose = document.getElementById('histModalClose');
  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');

  // ===== NOTIFIKASI + SUARA saat poin berubah =====
  // Dipanggil setiap poin naik / turun (ikan, tombol ±, bonus BIN).
  // Menampilkan kartu mengambang: nama, perubahan (+3 / -2), dan poin jadi berapa. Suara naik = nada naik, turun = nada turun.
  const ptToasts = document.getElementById('ptToasts');
  const soundBtn = document.getElementById('soundToggle');
  const MAX_TOASTS = 4;        // maksimal kartu tampil bersamaan
  const TOAST_MS = 4500;       // lama tampil (ms)
  let soundOn = true;
  try { soundOn = localStorage.getItem('galatamaSound') !== 'off'; } catch(e) {}
  let ptCtx = null;

  function refreshSoundBtn(){
    soundBtn.textContent = soundOn ? '🔊 Suara' : '🔇 Suara OFF';
    soundBtn.classList.toggle('off', !soundOn);
  }
  refreshSoundBtn();
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    try { localStorage.setItem('galatamaSound', soundOn ? 'on' : 'off'); } catch(e) {}
    refreshSoundBtn();
    if(soundOn) ptSound(true);   // contoh bunyi saat dinyalakan
  });

  // Rangkaian nada: [frekuensi, mulai(detik), durasi(detik)]
  function ptSound(up, big){
    if(!soundOn) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      if(!ptCtx) ptCtx = new AC();
      if(ptCtx.state === 'suspended') ptCtx.resume();
      const notes = up
        ? (big ? [[660,0,.12],[880,.11,.12],[1175,.22,.12],[1568,.33,.3]] : [[784,0,.12],[1175,.12,.25]])
        : [[587,0,.14],[392,.14,.3]];
      const now = ptCtx.currentTime;
      notes.forEach(([f, s, d]) => {
        const o = ptCtx.createOscillator(), g = ptCtx.createGain();
        o.type = up ? 'triangle' : 'sine';
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, now + s);
        g.gain.exponentialRampToValueAtTime(0.25, now + s + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + s + d);
        o.connect(g); g.connect(ptCtx.destination);
        o.start(now + s); o.stop(now + s + d + 0.05);
      });
    }catch(e){}
  }

  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function notifyPoints(t, delta, after, label){
    if(!delta) return;
    const up = delta > 0;
    const who = (t.nickname || '').trim() || ('Peserta #' + t.id);
    const el = document.createElement('div');
    el.className = 'pt-toast ' + (up ? 'up' : 'down');
    el.innerHTML =
      '<div class="pt-delta">' + (up ? '+' : '') + delta + '</div>' +
      '<div class="pt-info">' +
        '<div class="pt-name">' + esc(who) + '</div>' +
        '<div class="pt-total">Poin jadi <b>' + after + '</b></div>' +
        (label ? '<div class="pt-label">' + esc(label) + '</div>' : '') +
      '</div>';
    ptToasts.appendChild(el);
    while(ptToasts.children.length > MAX_TOASTS) ptToasts.firstElementChild.remove();
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 300);
    }, TOAST_MS);
    ptSound(up, Math.abs(delta) >= 3);
  }

  // Lama kedip warna saat poin berubah (ms) - samakan dengan durasi animasi di CSS
  const FLASH_MS = 2400;

  let searchIdx = 0;
  function markCur(scroll){
    const hits = [...document.querySelectorAll('tr.search-hit')];
    document.querySelectorAll('tr.search-cur').forEach(r => r.classList.remove('search-cur'));
    if(!hits.length) return;
    searchIdx = ((searchIdx % hits.length) + hits.length) % hits.length;
    const cur = hits[searchIdx];
    cur.classList.add('search-cur');
    if(scroll) cur.scrollIntoView({ block:'center', behavior:'smooth' });
  }
  function stepSearch(d){ searchIdx += d; markCur(true); }
  function applySearch(scroll){
    const q = searchInput.value.trim().toLowerCase();
    searchClear.style.display = q ? 'block' : 'none';
    let count = 0;
    document.querySelectorAll('#tableBodyTop tr, #tableBodyBottom tr').forEach(tr => {
      const t = teams.find(x => x.id === Number(tr.dataset.id));
      const hit = !!q && !!t && (t.nickname || '').toLowerCase().includes(q);
      tr.classList.toggle('search-hit', hit);
      if(hit) count++;
    });
    document.body.classList.toggle('searching', !!q);
    document.querySelector('.search-bar').classList.toggle('active', !!q);
    const cnt = document.getElementById('searchCount');
    cnt.style.display = q ? 'inline-block' : 'none';
    cnt.classList.toggle('none', !!q && count === 0);
    cnt.textContent = count ? (count + ' ditemukan') : 'Tidak ditemukan';
    markCur(!!scroll);
  }

  // ===== Search tersembunyi: hanya muncul lewat Ctrl+F =====
  function openSearch(){
    document.body.classList.add('search-open');
    searchInput.focus({ preventScroll:true });
    searchInput.select();
  }
  function closeSearch(){
    searchInput.value = '';
    applySearch();
    document.body.classList.remove('search-open');
    searchInput.blur();
  }
  searchInput.addEventListener('input', () => { searchIdx = 0; applySearch(true); });
  searchInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      // Enter = langsung buka popup "Tarik Ikan" untuk peserta pertama yang ditemukan
      const hit = document.querySelector('tr.search-cur') || document.querySelector('tr.search-hit');
      if(hit) openFish(Number(hit.dataset.id));
    } else if(e.key === 'Escape'){
      closeSearch();
    }
  });
  // Kalau kolom search kosong lalu kehilangan fokus, sembunyikan lagi
  searchInput.addEventListener('blur', () => {
    setTimeout(() => {
      if(searchInput.value.trim() === '' && document.activeElement !== searchInput && !fishModal.classList.contains('open')){
        document.body.classList.remove('search-open');
      }
    }, 150);
  });
  searchClear.addEventListener('mousedown', (e) => e.preventDefault());
  searchClear.addEventListener('click', () => closeSearch());
  // Tombol kecil = cadangan kalau Ctrl+F ditangkap browser (mis. fokus belum di halaman)
  document.getElementById('searchFab').addEventListener('click', openSearch);
  // Pastikan halaman memegang fokus keyboard supaya Ctrl+F sampai ke halaman, bukan ke browser
  window.focus();
  document.addEventListener('pointerdown', () => window.focus(), { once:true });
  ['searchPrev','searchNext'].forEach(id => {
    const b = document.getElementById(id);
    b.addEventListener('mousedown', (e) => e.preventDefault());
    b.addEventListener('click', () => stepSearch(id === 'searchNext' ? 1 : -1));
  });

  // Pintasan Ctrl+F (atau Cmd+F di Mac): munculkan kolom search lalu langsung fokus
  document.addEventListener('keydown', (e) => {
    if((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 'f'){
      e.preventDefault();
      if(histModal.classList.contains('open')) closeHistory();
      openSearch();
    }
  });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){ closeHistory(); closeFish(); }
  });

  // ===== Hitungan poin berdasarkan jenis ikan =====
  const FISH = [{n:'Secret',p:1},{n:'Big',p:1},{n:'Shiny',p:1},{n:'Mutasi',p:1},{n:'Pelagon',p:2},{n:'Mutant Cosmic',p:2},{n:'Megalodon',p:3},{n:'Glacial',p:3},{n:'FB 100+',p:3},{n:'FB Maxton',p:5},{n:'Forgotten',p:5}];
  const fishModal = document.getElementById('fishModal');
  const fishList = document.getElementById('fishList');
  let fishTarget = null;
  fishList.innerHTML = FISH.map((f,i) =>
    '<label class="fish-opt"><input type="checkbox" data-i="'+i+'"> '+f.n+'<span class="fp">+'+f.p+'P</span></label>').join('');

  function fishPicked(){ return [...fishList.querySelectorAll('input:checked')].map(c => FISH[+c.dataset.i]); }
  function updateFishTotal(){
    document.getElementById('fishTotal').textContent = '+' + fishPicked().reduce((a,f) => a + f.p, 0);
  }
  function openFish(id){
    fishTarget = id;
    const t = teams.find(x => x.id === id);
    document.getElementById('fishSub').textContent = t.nickname || ('Peserta #' + id);
    fishList.querySelectorAll('input').forEach(c => c.checked = false);
    updateFishTotal();
    fishModal.classList.add('open');
  }
  function closeFish(){ fishModal.classList.remove('open'); fishTarget = null; }
  fishList.addEventListener('change', updateFishTotal);
  document.getElementById('fishClose').addEventListener('click', closeFish);
  fishModal.addEventListener('click', (e) => { if(e.target === fishModal) closeFish(); });
  document.getElementById('fishOk').addEventListener('click', () => {
    const picked = fishPicked();
    if(!picked.length || fishTarget === null){ closeFish(); return; }
    const t = teams.find(x => x.id === fishTarget);
    const delta = picked.reduce((a,f) => a + f.p, 0);
    const label = picked.map(f => f.n).join(' + ');
    t.points += delta;
    t.flash = { dir: 'up', time: Date.now() };   // kedip hijau (poin naik)
    t.history.push({ delta, after: t.points, time: Date.now(), label });
    notifyPoints(t, delta, t.points, label);     // notifikasi + suara
    closeFish();
    // Kosongkan search supaya siap untuk pencarian berikutnya (kolom search tetap terbuka)
    searchInput.value = '';
    render();
    searchInput.focus();
  });

  // ===== Popup tambah / kurang poin (+1..+10 dan -1..-10) =====
  const pmModal = document.getElementById('pmModal');
  let pmTarget = null;
  function openPm(id, btn){
    pmTarget = id;
    const t = teams.find(x => x.id === id);
    document.getElementById('pmSub').textContent = t.nickname || ('Peserta #' + id);
    pmModal.classList.add('open');
    // Tempatkan popup tepat di bawah tombol ± (naik ke atas kalau tidak muat), tetap di dalam layar
    const box = pmModal.querySelector('.modal-box');
    const r = btn.getBoundingClientRect();
    const w = box.offsetWidth, h = box.offsetHeight, gap = 4;
    let left = r.left + r.width / 2 - w / 2;
    let top = r.bottom + gap;
    if(top + h > window.innerHeight - gap) top = r.top - h - gap;
    left = Math.max(gap, Math.min(left, window.innerWidth - w - gap));
    top = Math.max(gap, top);
    box.style.left = left + 'px';
    box.style.top = top + 'px';
  }
  function closePm(){ pmModal.classList.remove('open'); pmTarget = null; }
  function applyDelta(id, delta){
    const t = teams.find(x => x.id === id);
    if(!t) return;
    const newPoints = Math.max(0, t.points + delta);
    const actual = newPoints - t.points;
    t.points = newPoints;
    if(actual){
      t.flash = { dir: actual > 0 ? 'up' : 'down', time: Date.now() };   // hijau = naik, biru = turun
      t.history.push({ delta: actual, after: newPoints, time: Date.now(), label: 'Manual' });
      notifyPoints(t, actual, newPoints, 'Manual');                       // notifikasi + suara
    }
    render();
  }
  for(let i = 1; i <= 10; i++){
    [['pmPlus','plus',i,'+'],['pmMinus','minus',-i,'−']].forEach(([box, cls, d, sg]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = cls;
      b.textContent = sg + i;
      b.addEventListener('click', () => { const id = pmTarget; closePm(); if(id !== null) applyDelta(id, d); });
      document.getElementById(box).appendChild(b);
    });
  }
  document.getElementById('pmClose').addEventListener('click', closePm);
  pmModal.addEventListener('click', (e) => { if(e.target === pmModal) closePm(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closePm(); });

  // Urutan: poin terbanyak di atas. Kalau poin sama, mengikuti urutan baris.
  function getSorted(){
    return [...teams].sort((a,b) => (b.points - a.points) || (a.id - b.id));
  }

  function formatTime(ts){
    const d = new Date(ts);
    const pad = n => String(n).padStart(2,'0');
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  // Penanda poin: zero (0) = MERAH, pos (>0) = HIJAU (warnanya diatur di CSS)
  function applyScoreColor(tr, td, points){
    const tm = teams.find(x => x.id === Number(tr.dataset.id));
    tr.classList.toggle('blank', !tm || (tm.nickname || '').trim() === '');
    tr.classList.toggle('zero', points <= 0);
    tr.classList.toggle('pos', points > 0);
  }

  // Poin sama di peringkat 1-10: tiap kelompok poin yang sama dapat 1 warna yang sama
  let tieColor = {};
  let compRank = {};   // peringkat kompetisi: poin sama = peringkat sama (untuk medali)
  const TIE_COLORS = 5;
  const TIE_RANK_LIMIT = 10;
  function computeTies(sorted){
    compRank = {};
    // Fase poin awal / BIN: selama semua poin yang ada HANYA berasal dari bonus BIN,
    // nomor juara & warna berurutan 1, 2, 3, ... (tidak boleh 1 semua).
    // Begitu ada poin dari luar BIN (ikan / manual), poin sama baru boleh berperingkat sama.
    const binPhase = sorted.every(t => t.points === 0);
    if(binPhase){
      sorted.forEach((t, i) => { compRank[t.id] = i + 1; });
      tieColor = {};
      return;
    }
    sorted.forEach(t => {
      compRank[t.id] = 1 + sorted.filter(o => o.points > t.points).length;
    });
    const count = {};
    // Hanya poin sama yang memperebutkan juara 1, 2, atau 3 (peringkat kompetisi <= 3) yang diberi warna kelompok.
    // Poin sama di peringkat 4 ke bawah tidak diwarnai khusus (tetap hijau biasa).
    sorted.slice(0, TIE_RANK_LIMIT).forEach(t => { if(t.points > 0 && compRank[t.id] <= 3) count[t.points] = (count[t.points] || 0) + 1; });
    tieColor = {};
    let idx = 0;
    sorted.slice(0, TIE_RANK_LIMIT).forEach(t => {
      if(t.points > 0 && count[t.points] > 1 && tieColor[t.points] === undefined){
        tieColor[t.points] = idx++ % TIE_COLORS;
      }
    });
  }

  // Warna peringkat:
  //  - baris bertanda merah (klik NO) -> merah solid (diatur CSS .red)
  //  - poin sama di peringkat 1-10  -> warna kelompok (sama untuk yang poinnya sama)
  //  - juara 1-3 (poin > 0, tidak seri) -> emas, perak, perunggu
  //  - lainnya -> hijau (poin > 0) / merah (poin 0) lewat applyScoreColor
  function applyRankColor(tr, rank, points){
    tr.classList.remove('rank-1','rank-2','rank-3','tie-0','tie-1','tie-2','tie-3','tie-4');
    if(points > 0 && rank <= TIE_RANK_LIMIT && tieColor[points] !== undefined){
      tr.classList.add('tie-' + tieColor[points]);
    } else if(points > 0 && rank <= 3){
      tr.classList.add('rank-' + rank);
    }
  }

  function openHistory(teamId){
    const t = teams.find(x => x.id === teamId);
    if(!t) return;
    histModalTitle.textContent = 'History';
    histModalSub.textContent = t.nickname || ('Peserta #' + t.id);
    histModalTitle.appendChild(histModalSub);
    if(!t.history.length){
      histModalBody.innerHTML = '<div class="hist-empty">Belum ada perubahan poin.</div>';
    } else {
      const items = t.history.slice().reverse().map(h => {
        const sign = h.delta > 0 ? '+' : '';
        const cls = h.delta > 0 ? 'pos' : 'neg';
        return '<li class="hist-item"><span class="hist-delta ' + cls + '">' + sign + h.delta + '</span>'
          + '<span class="hist-meta"><span class="hist-after">poin jadi ' + h.after + '</span>'
          + (h.label ? '<span class="hist-fish">' + h.label + '</span>' : '')
          + '<span class="hist-time">' + formatTime(h.time) + '</span></span></li>';
      }).join('');
      histModalBody.innerHTML = '<ul class="hist-list">' + items + '</ul>';
    }
    histModal.classList.add('open');
  }
  function closeHistory(){ histModal.classList.remove('open'); }
  histModalClose.addEventListener('click', closeHistory);
  histModal.addEventListener('click', (e) => { if(e.target === histModal) closeHistory(); });

  function buildRow(team, rank){
    const tr = document.createElement('tr');
    tr.dataset.id = team.id;
    if(team.id === ADMIN_ID) tr.classList.add('server');   // baris server = hijau solid
    if(team.red) tr.classList.add('red');                  // baris bertanda merah

    const tdRank = document.createElement('td');
    tdRank.className = 'rank';
    // Juara 1-3 (poin > 0): nomor diganti medali emas, perak, perunggu
    const MEDALS = { 1:true, 2:true, 3:true };
    // Kalau poin sama (perebutan juara 1-3), semua yang seri dapat medali yang sama,
    // termasuk yang urutannya sudah di bawah nomor 3.
    const medalRank = compRank[team.id] || rank;
    if(team.points > 0 && MEDALS[medalRank]){
      const m = document.createElement('span');
      m.className = 'medal m' + medalRank;
      m.textContent = medalRank;
      tdRank.appendChild(m);
    } else {
      tdRank.textContent = rank;
    }

    // TOMBOL MERAH: klik kolom NO untuk mewarnai baris merah, klik lagi untuk membatalkan
    // (hanya warna; poin, urutan, dan medali tidak berubah). Baris No 30 (Admin) tidak bisa.
    if(team.id !== ADMIN_ID){
      tdRank.classList.add('red-toggle');
      tdRank.title = 'Klik untuk tandai MERAH / batalkan';
      tdRank.addEventListener('click', () => {
        const t = teams.find(x => x.id === team.id);
        t.red = !t.red;
        tr.classList.toggle('red', t.red);
      });
    }

    const tdNick = document.createElement('td');
    tdNick.className = 'name-cell';
    const nickInput = document.createElement('input');
    nickInput.type = 'text';
    nickInput.className = 'team-nick';
    nickInput.value = team.nickname;
    nickInput.placeholder = 'Nama Display';
    nickInput.dataset.id = team.id;
    nickInput.dataset.field = 'nick';
    nickInput.addEventListener('input', (e) => {
      teams.find(x => x.id === team.id).nickname = e.target.value;
      renderPodium(getSorted());
      applySearch();
    });
    tdNick.appendChild(nickInput);

    const tdPoints = document.createElement('td');
    tdPoints.className = 'poin-cell';
    applyScoreColor(tr, tdPoints, team.points);
    applyRankColor(tr, rank, team.points);
    const pointsWrap = document.createElement('div');
    pointsWrap.className = 'points-wrap';

    const pointsInput = document.createElement('input');
    pointsInput.type = 'text';
    pointsInput.className = 'points';
    pointsInput.value = team.points;
    pointsInput.readOnly = true;
    pointsInput.tabIndex = -1;
    pointsInput.dataset.id = team.id;
    pointsInput.dataset.field = 'points';

    // Tombol ± = buka popup +1..+10 / -1..-10
    const pmBtn = document.createElement('button');
    pmBtn.type = 'button';
    pmBtn.className = 'pm-btn';
    pmBtn.textContent = '±';
    pmBtn.title = 'Tambah / kurangi poin (+1 sampai +10, -1 sampai -10)';
    pmBtn.addEventListener('click', () => openPm(team.id, pmBtn));

    const fishBtn = document.createElement('button');
    fishBtn.type = 'button';
    fishBtn.className = 'fish-btn';
    const fishImg = document.createElement('img');
    fishImg.src = FISH_IMG;
    fishImg.alt = 'Tambah poin';
    fishImg.draggable = false;
    fishBtn.appendChild(fishImg);
    fishBtn.title = 'Tambah poin berdasarkan jenis ikan';
    fishBtn.addEventListener('click', () => openFish(team.id));

    pointsWrap.append(pointsInput, pmBtn, fishBtn);
    tdPoints.appendChild(pointsWrap);

    const tdJoin = document.createElement('td');
    tdJoin.className = 'center';
    const joinBtn = document.createElement('button');
    joinBtn.type = 'button';
    joinBtn.dataset.id = team.id;
    joinBtn.dataset.field = 'join';
    function refreshJoin(){
      const t = teams.find(x => x.id === team.id);
      joinBtn.className = 'join-btn' + (t.joined ? ' joined' : '');
      joinBtn.textContent = '✓';
      joinBtn.title = t.joined ? 'Sudah absen — klik untuk batalkan' : 'Belum absen — klik untuk centang';
    }
    refreshJoin();
    joinBtn.addEventListener('click', () => {
      const t = teams.find(x => x.id === team.id);
      t.joined = !t.joined;
      refreshJoin();
    });
    tdJoin.appendChild(joinBtn);

    const tdHist = document.createElement('td');
    tdHist.className = 'center';
    const histBtn = document.createElement('button');
    histBtn.type = 'button';
    histBtn.className = 'hist-btn';
    histBtn.title = 'Lihat history poin';
    histBtn.innerHTML = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
    if(team.history.length){
      const count = document.createElement('span');
      count.className = 'hist-count';
      count.textContent = team.history.length;
      histBtn.appendChild(count);
    }
    histBtn.addEventListener('click', () => openHistory(team.id));
    tdHist.appendChild(histBtn);

    // Kedip hijau (poin naik) / biru (poin turun); lanjut dari sisa waktu kalau baris dibangun ulang
    if(team.flash && Date.now() - team.flash.time < FLASH_MS){
      const el = Date.now() - team.flash.time;
      tr.classList.add(team.flash.dir === 'up' ? 'flash-up' : 'flash-down');
      [tdRank, tdNick, tdPoints, tdJoin, tdHist].forEach(td => td.style.animationDelay = '-' + el + 'ms');
    }

    tr.append(tdRank, tdNick, tdPoints, tdJoin, tdHist);
    return tr;
  }

  // ===== PODIUM juara 1-2-3 (tampil: 2 - 1 - 3) =====
  function renderPodium(sorted){
    const el = document.getElementById('podium');
    if(!el) return;
    const top = sorted.filter(t => t.id !== ADMIN_ID).slice(0, 3);
    el.innerHTML = [1, 0, 2].map(i => {
      const t = top[i], rank = i + 1;
      const has = !!t && t.points > 0;
      const name = has ? (((t.nickname || '').trim()) || ('Peserta #' + t.id)) : '—';
      return '<div class="pod p' + rank + (has ? '' : ' empty') + '">'
        + (rank === 1 ? '<div class="crown">&#128081;</div>' : '')
        + '<div class="pod-medal m' + rank + '">' + rank + '</div>'
        + '<div class="pod-name">' + esc(name) + '</div>'
        + '<div class="pod-pts"><b>' + (has ? t.points : 0) + '</b> poin</div>'
        + '<div class="pod-step">' + rank + '</div></div>';
    }).join('');
  }

  function render(){
    tbodyTop.innerHTML = '';
    tbodyBottom.innerHTML = '';
    const sorted = getSorted();
    computeTies(sorted);
    renderPodium(sorted);
    sorted.forEach((team, idx) => {
      const rank = idx + 1;
      (rank <= ROWS_PER_TABLE ? tbodyTop : tbodyBottom).appendChild(buildRow(team, rank));
    });
    applySearch();
  }
  render();

  // ===== Pilihan mode Day / Night =====
  const modeBtns = document.querySelectorAll('#modeToggle button');
  function setMode(m){
    document.body.classList.toggle('night', m === 'night');
    modeBtns.forEach(b => b.classList.toggle('on', b.dataset.mode === m));
    try { localStorage.setItem('galatamaMode', m); } catch(e) {}
  }
  modeBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  let savedMode = 'day';
  try { savedMode = localStorage.getItem('galatamaMode') === 'night' ? 'night' : 'day'; } catch(e) {}
  setMode(savedMode);

  // Skala otomatis: tampilan didesain 1400px lalu diperkecil/diperbesar agar pas selebar layar (tanpa scroll)
  const wrapEl = document.querySelector('.wrap');
  const DESIGN_W = 1400;
  function fitToScreen(){
    const availW = document.documentElement.clientWidth - 20;
    const availH = window.innerHeight - 12;
    wrapEl.style.zoom = '';
    wrapEl.style.transform = '';
    wrapEl.style.marginLeft = '';
    wrapEl.style.marginBottom = '';
    const natH = wrapEl.offsetHeight || 1;
    // skala = yang terkecil antara lebar & tinggi layar, supaya SEMUA muat 1 layar tanpa scroll
    const scale = Math.max(0.2, Math.min(availW / DESIGN_W, availH / natH, 1.6));
    if('zoom' in document.body.style){
      wrapEl.style.zoom = scale;
    } else {
      wrapEl.style.transformOrigin = 'top left';
      wrapEl.style.transform = 'scale(' + scale + ')';
      wrapEl.style.marginLeft = Math.max(0, (availW - DESIGN_W * scale) / 2) + 'px';
      wrapEl.style.marginBottom = (-(1 - scale) * natH) + 'px';
    }
  }
  window.addEventListener('resize', fitToScreen);
  window.addEventListener('load', fitToScreen);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitToScreen);
  fitToScreen();
</script>
</body>
</html>
